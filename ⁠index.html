<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>APP PLUS⁺ OS | متجر تطبيقات بلس النخبة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#070709',
              dark: '#0c0d12',
              card: '#13141b',
              red: '#ff1a3c',
              redGlow: '#ff2e4d',
              redDark: '#8b0e1e'
            }
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            orbitron: ['Orbitron', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; user-select: none; }
    input, textarea { user-select: text; }
    body { background-color: #070709; color: #f3f4f6; font-family: 'Cairo', sans-serif; overflow-x: hidden; min-height: 100dvh; -webkit-overflow-scrolling: touch; }
    .hero-glow-bg {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(255, 26, 60, 0.22) 0%, rgba(255, 26, 60, 0.05) 50%, rgba(0,0,0,0) 75%);
      pointer-events: none; z-index: 0;
    }
    .neon-text-glow { text-shadow: 0 0 14px rgba(255, 26, 60, 0.75), 0 0 28px rgba(255, 26, 60, 0.4); }
    .press-effect:active { transform: scale(0.96); }
    .text-3d-glow {
      text-shadow: 0 1px 0 #8b0e1e, 0 2px 0 #6b0714, 0 3px 0 #4a040d, 0 4px 6px rgba(0,0,0,0.9), 0 0 12px rgba(255,26,60,0.7);
    }
  </style>
</head>
<body class="relative flex flex-col items-center justify-start antialiased pb-28">

  <div class="hero-glow-bg"></div>

  <div class="w-full max-w-md min-h-screen px-4 pt-3 flex flex-col relative z-10">

    <!-- 1. الهيدر -->
    <header class="w-full flex items-center justify-between py-2 mb-2">
      <div class="flex items-center gap-1.5 text-right">
        <h1 class="text-xl font-black tracking-tight text-white flex items-center gap-1">
          <span>مرحباً،</span>
          <span class="text-brand-red neon-text-glow">بك</span>
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <button class="press-effect px-2.5 py-1 text-xs font-bold text-gray-300 bg-[#161822] border border-gray-800 rounded-full">EN</button>
        <div class="press-effect flex items-center gap-1.5 px-3 py-1 bg-[#14161f] border border-gray-800 rounded-full shadow-sm">
          <span class="w-5 h-5 rounded-full bg-brand-red flex items-center justify-center text-[10px] font-black text-white">S</span>
          <span class="text-xs font-bold text-gray-200">حسابي</span>
          <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
    </header>

    <!-- 2. الشعار والاسم -->
    <section class="flex flex-col items-center justify-center my-2 text-center relative">
      <div class="relative w-56 h-56 flex items-center justify-center">
        <img id="customLogoImg" 
             class="w-full h-full object-contain rounded-full drop-shadow-[0_0_20px_rgba(255,26,60,0.55)]" 
             alt="APP PLUS+ OS Logo" 
             src="https://i.ibb.co/v7mPxQY/2.png">
      </div>

      <div class="mt-2 text-center" dir="ltr">
        <h2 class="text-2xl font-black font-orbitron tracking-wider text-white text-3d-glow">
          APP PLUS<sup class="text-brand-red text-lg font-bold ml-0.5">+</sup> <span class="text-brand-red">OS</span>
        </h2>
      </div>
    </section>

    <!-- 3. شريط البحث -->
    <div class="relative w-full my-3">
      <input type="text" placeholder="ابحث عن التطبيقات والأدوات والألعاب..." class="w-full py-2.5 pr-12 pl-4 text-xs font-bold text-gray-200 placeholder-gray-500 bg-[#12141c] border border-gray-800 rounded-full focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red transition-all">
      <div class="absolute right-4 top-1/2 -translate-y-1/2 text-brand-red">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </div>

    <!-- 4. الأقسام الأربعة -->
    <div class="grid grid-cols-4 gap-2 my-2 text-center">
      <div class="flex flex-col items-center gap-1.5 cursor-pointer press-effect">
        <div class="relative w-12 h-12 flex items-center justify-center bg-[#13151f] border border-gray-800 rounded-full hover:border-brand-red/60 transition-all">
          <svg class="absolute -top-1 w-8 h-2 text-brand-red" viewBox="0 0 32 8" fill="none"><path d="M2 7C8 2 24 2 30 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <span class="text-[11px] font-bold text-gray-400">الألعاب +</span>
      </div>

      <div class="flex flex-col items-center gap-1.5 cursor-pointer press-effect">
        <div class="relative w-12 h-12 flex items-center justify-center bg-[#13151f] border border-gray-800 rounded-full hover:border-brand-red/60 transition-all">
          <svg class="absolute -top-1 w-8 h-2 text-brand-red" viewBox="0 0 32 8" fill="none"><path d="M2 7C8 2 24 2 30 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
        </div>
        <span class="text-[11px] font-bold text-gray-400">التعديلات +</span>
      </div>

      <div class="flex flex-col items-center gap-1.5 cursor-pointer press-effect">
        <div class="relative w-12 h-12 flex items-center justify-center bg-[#13151f] border border-gray-800 rounded-full hover:border-brand-red/60 transition-all">
          <svg class="absolute -top-1 w-8 h-2 text-brand-red" viewBox="0 0 32 8" fill="none"><path d="M2 7C8 2 24 2 30 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        </div>
        <span class="text-[11px] font-bold text-gray-400">تطبيقات iOS</span>
      </div>

      <div class="flex flex-col items-center gap-1.5 cursor-pointer press-effect">
        <div class="relative w-12 h-12 flex items-center justify-center bg-[#13151f] border border-gray-800 rounded-full hover:border-brand-red/60 transition-all">
          <svg class="absolute -top-1 w-8 h-2 text-brand-red" viewBox="0 0 32 8" fill="none"><path d="M2 7C8 2 24 2 30 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <span class="text-[11px] font-bold text-gray-400">الأدوات</span>
      </div>
    </div>

    <!-- 5. التطبيقات -->
    <div class="flex items-center justify-between mt-4 mb-2">
      <div class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-brand-red"></span>
        <h3 class="text-sm font-bold text-white">التطبيقات الموصى بها</h3>
      </div>
      <span class="text-[10px] font-bold text-gray-500">(8) متوفر</span>
    </div>

    <div class="bg-[#12141d] border border-gray-800 rounded-xl p-3 flex items-center justify-between mb-2">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-lg bg-yellow-500/20 border border-yellow-500/40 flex items-center justify-center text-lg">👻</div>
        <div class="text-right">
          <div class="flex items-center gap-1">
            <h4 class="text-xs font-bold text-white">سناب شات بلس الترا</h4>
            <span class="text-[9px] px-1 bg-brand-red/20 text-brand-red border border-brand-red/30 rounded font-bold">VIP</span>
          </div>
          <p class="text-[10px] text-gray-500 truncate max-w-[170px]">حفظ الستوري والمحادثات بجودة 4K مع التخفي</p>
        </div>
      </div>
      <button class="press-effect px-3 py-1 bg-brand-red hover:bg-brand-redGlow text-white text-[11px] font-bold rounded-lg transition-all">تثبيت</button>
    </div>

  </div>

  <nav class="fixed bottom-0 inset-x-0 bg-[#090a10]/95 backdrop-blur-xl border-t border-gray-900/90 py-2 px-6 flex items-center justify-between z-50 max-w-md mx-auto">
    <button class="flex flex-col items-center gap-0.5 text-brand-red relative">
      <span class="absolute -top-2 w-6 h-0.5 bg-brand-red rounded-full shadow-[0_0_10px_#ff1a3c]"></span>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px] font-bold">الرئيسية</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-gray-300">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <span class="text-[10px] font-bold">بحث</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-gray-300">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      <span class="text-[10px] font-bold">مكتبتي</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-gray-300">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span class="text-[10px] font-bold">الإعدادات</span>
    </button>
  </nav>

</body>
</html>
